<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Stray Dream World 03</title>

    <link rel="stylesheet" href="env03.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="env03.js" defer></script>
</head>

<body>

    <div id="top-zone">
        <div id="moon">☾</div>
        <div id="stars">✦ ✧ ✦</div>
    </div>

    <div id="main-zone">

        <div id="text-box">
            <h1>Stray Dream World</h1>
            <p>
                In this soft purple dream world, stray cats and dogs finally have a peaceful place to rest.
                Under the quiet moon and glowing stars, they are safe, warm, and no longer alone.
            </p>

            <button id="show-title">Show World Name</button>
            <button id="show-elements">Show Elements</button>
            <button id="show-creature">Show Main Creature</button>
            <button id="count-clicks">Count Comfort</button>

            <div id="environment-output"></div>
        </div>

    </div>

</body>

</html>
